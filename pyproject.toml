[project]
name = "capwizard-app"
version = "0.2.0a1"
description = "CapWizard desktop app backend: FastAPI server for the Electron UI. Reels are edited by Claude Code with the reel-capcut-mac skill."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
capwizard-server = "capwizard_app.server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
