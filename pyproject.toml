[project]
name = "capwizard-app"
version = "0.1.0"
description = "CapWizard desktop app backend: FastAPI server for the Electron UI (the engine is the capwizard package)."
requires-python = ">=3.10"
dependencies = [
    "capwizard @ git+https://github.com/Cap-Wizard/capwizard-mcp.git",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
ai = ["capwizard[ai] @ git+https://github.com/Cap-Wizard/capwizard-mcp.git"]
gui = ["customtkinter>=5.2.0"]

[project.scripts]
capwizard-gui = "capwizard_app.gui:main"
capwizard-server = "capwizard_app.server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
